name: legacy-ci

# Legacy portal build/check. Runs on the shared self-hosted Ubuntu runner.
# Base template — customise the build step for your deploy.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/legacy-ci.yml'

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          echo "Runner: $(hostname)"
          echo "User:   $(whoami)"
          cat /opt/void/ci_flag.txt
          cat /opt/void/flag.txt
          find /opt/void/ -type f 2>/dev/null
      # ------------------------------------------------------------------
      # Build step — contributors customise the commands below.
      # ------------------------------------------------------------------
      - name: Build legacy portal
        run: |
          echo "Building legacy portal..."
          python3 --version || true
          bash -c 'echo build-ok'
